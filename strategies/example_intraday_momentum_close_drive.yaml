{
  "schema_version": 0,
  "name": "nq_intraday_momentum_close_drive_v1",
  "strategy_family": "intraday_momentum",
  "market_hypothesis": "NQ late-day positioning can create continuation bursts near the close when a multi-minute impulse breaks intraday balance.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "18:30-20:45", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "momentum": {"type": "momentum", "lookback_minutes": 6, "threshold_points": 11}
  },
  "entry": {
    "long": {"all": [{"left": "momentum", "op": ">=", "right": "11"}]},
    "short": {"all": [{"left": "momentum", "op": "<=", "right": "-11"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 14},
    "take_profit": {"type": "points", "value": 20},
    "max_holding_minutes": 18
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 16,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "momentum_lookback_minutes": {"values": [4, 6, 9]},
    "momentum_threshold_points": {"values": [9, 11, 15]},
    "stop_points": {"values": [10, 14, 18]},
    "take_profit_points": {"values": [16, 20, 26]},
    "max_holding_minutes": {"values": [12, 18]}
  },
  "cost_model": "nq_conservative_v1"
}
