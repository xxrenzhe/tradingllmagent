{
  "schema_version": 0,
  "name": "nq_gap_fade_small_open_v1",
  "strategy_family": "gap_fade_or_continuation",
  "market_hypothesis": "Smaller NQ opening gaps can fade when the first regular-session print overextends from the prior close without immediate continuation.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:30-20:45", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "gap": {"type": "gap", "threshold_points": 5, "mode": "fade"}
  },
  "entry": {
    "long": {"all": [{"left": "gap", "op": "<=", "right": "-5"}]},
    "short": {"all": [{"left": "gap", "op": ">=", "right": "5"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 10},
    "take_profit": {"type": "points", "value": 14},
    "max_holding_minutes": 22
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 1,
    "max_daily_loss_r": 2
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "gap_threshold_points": {"values": [4, 5, 8]},
    "gap_mode": {"values": ["fade", "continuation"]},
    "stop_points": {"values": [8, 10, 14]},
    "take_profit_points": {"values": [12, 14, 18]},
    "max_holding_minutes": {"values": [15, 22]}
  },
  "cost_model": "nq_conservative_v1"
}
