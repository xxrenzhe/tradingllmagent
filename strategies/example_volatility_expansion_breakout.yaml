{
  "schema_version": 0,
  "name": "nq_volatility_expansion_breakout_v1",
  "strategy_family": "volatility_expansion",
  "market_hypothesis": "A larger NQ range expansion can mark a real breakout when close exceeds the prior bar extreme and the trade has enough room to breathe.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:45-20:30", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "realized_volatility": {"type": "realized_volatility", "window": 10, "expansion_multiple": 1.8}
  },
  "entry": {
    "long": {"all": [{"left": "close", "op": ">", "right": "prior_high"}]},
    "short": {"all": [{"left": "close", "op": "<", "right": "prior_low"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 18},
    "take_profit": {"type": "points", "value": 32},
    "max_holding_minutes": 40
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 18,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "volatility_window": {"values": [8, 10, 14]},
    "volatility_expansion_multiple": {"values": [1.5, 1.8, 2.1]},
    "stop_points": {"values": [14, 18, 24]},
    "take_profit_points": {"values": [26, 32, 42]},
    "max_holding_minutes": {"values": [30, 40]}
  },
  "cost_model": "nq_conservative_v1"
}
