{
  "schema_version": 0,
  "name": "nq_volatility_expansion_v1",
  "strategy_family": "volatility_expansion",
  "market_hypothesis": "NQ can trend after a sudden intraday range expansion closes beyond the prior bar range.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
