    "short": {"all": [{"left": "close", "op": "<", "right": "prior_low"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 18},
    "take_profit": {"type": "points", "value": 28},
    "max_holding_minutes": 35
  },
