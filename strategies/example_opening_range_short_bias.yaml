{
  "schema_version": 0,
  "name": "nq_opening_range_short_bias_v1",
  "strategy_family": "opening_range_breakout",
  "market_hypothesis": "Downside NQ opening-range failures can accelerate when early-session weakness breaks the initial range with bounded single-contract risk.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "short",
