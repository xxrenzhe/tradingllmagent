  "parameters": {
    "opening_range_minutes": {"values": [4, 6, 9]},
    "stop_points": {"values": [8, 12, 16]},
    "take_profit_points": {"values": [12, 16, 22]},
    "max_holding_minutes": {"values": [15, 22]}
  },
  "cost_model": "nq_conservative_v1"
}
