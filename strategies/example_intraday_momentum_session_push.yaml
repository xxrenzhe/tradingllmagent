{
  "schema_version": 0,
  "name": "nq_intraday_momentum_session_push_v1",
  "strategy_family": "intraday_momentum",
  "market_hypothesis": "NQ session continuation can follow a stronger multi-minute impulse when stops are wide enough to avoid normal micro pullbacks.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "14:00-20:15", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "momentum": {"type": "momentum", "lookback_minutes": 8, "threshold_points": 14}
  },
  "entry": {
    "long": {"all": [{"left": "momentum", "op": ">=", "right": "14"}]},
    "short": {"all": [{"left": "momentum", "op": "<=", "right": "-14"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 18},
    "take_profit": {"type": "points", "value": 28},
    "max_holding_minutes": 45
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 18,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "momentum_lookback_minutes": {"values": [6, 8, 12]},
    "momentum_threshold_points": {"values": [10, 14, 18]},
    "stop_points": {"values": [14, 18, 22]},
    "take_profit_points": {"values": [24, 28, 36]},
    "max_holding_minutes": {"values": [30, 45]}
  },
  "cost_model": "nq_conservative_v1"
}
