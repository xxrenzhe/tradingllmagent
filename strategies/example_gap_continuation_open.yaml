{
  "schema_version": 0,
  "name": "nq_gap_continuation_open_v1",
  "strategy_family": "gap_fade_or_continuation",
  "market_hypothesis": "Large NQ opening gaps can continue in the gap direction when the first regular-session print does not immediately fade.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:30-20:45", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "gap": {"type": "gap", "threshold_points": 8, "mode": "continuation"}
  },
  "entry": {
    "long": {"all": [{"left": "gap", "op": ">=", "right": "8"}]},
    "short": {"all": [{"left": "gap", "op": "<=", "right": "-8"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 14},
    "take_profit": {"type": "points", "value": 22},
    "max_holding_minutes": 30
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 1,
    "max_daily_loss_r": 2
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "gap_threshold_points": {"values": [6, 8, 12]},
    "gap_mode": {"values": ["continuation", "fade"]},
    "stop_points": {"values": [10, 14, 18]},
    "take_profit_points": {"values": [18, 22, 28]},
    "max_holding_minutes": {"values": [20, 30, 45]}
  },
  "cost_model": "nq_conservative_v1"
}
