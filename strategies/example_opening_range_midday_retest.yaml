{
  "schema_version": 0,
  "name": "nq_opening_range_midday_retest_v1",
  "strategy_family": "opening_range_breakout",
  "market_hypothesis": "NQ can retest and break the morning range again during the liquid mid-session window when losses are capped tightly.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "14:30-19:30", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "opening_range": {"type": "opening_range", "minutes": 10}
  },
  "entry": {
    "long": {"all": [{"left": "close", "op": ">", "right": "opening_range.high"}]},
    "short": {"all": [{"left": "close", "op": "<", "right": "opening_range.low"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 14},
    "take_profit": {"type": "points", "value": 22},
    "max_holding_minutes": 35
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 20,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "opening_range_minutes": {"values": [8, 10, 15]},
    "stop_points": {"values": [10, 14, 18]},
    "take_profit_points": {"values": [18, 22, 28]},
    "max_holding_minutes": {"values": [25, 35]}
  },
  "cost_model": "nq_conservative_v1"
}
