{
  "schema_version": 0,
  "name": "nq_intraday_momentum_v1",
  "strategy_family": "intraday_momentum",
  "market_hypothesis": "Short-horizon NQ momentum can persist when recent 1m closes move far enough in one direction during the active session.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:30-20:45", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "momentum": {"type": "momentum", "lookback_minutes": 5, "threshold_points": 8}
  },
  "entry": {
    "long": {"all": [{"left": "momentum", "op": ">=", "right": "8"}]},
    "short": {"all": [{"left": "momentum", "op": "<=", "right": "-8"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 16},
    "take_profit": {"type": "points", "value": 24},
    "max_holding_minutes": 30
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 30,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "momentum_lookback_minutes": {"values": [3, 5]},
    "momentum_threshold_points": {"values": [6, 8]},
    "stop_points": {"values": [12, 16]},
    "take_profit_points": {"values": [20, 24]},
    "max_holding_minutes": {"values": [20, 30]}
  },
  "cost_model": "nq_conservative_v1"
}
