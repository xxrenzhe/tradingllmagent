{
  "schema_version": 0,
  "name": "nq_intraday_momentum_open_drive_v1",
  "strategy_family": "intraday_momentum",
  "market_hypothesis": "NQ open-drive impulses can persist briefly after the cash open when the first few minutes move decisively in one direction.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:30-16:00", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "momentum": {"type": "momentum", "lookback_minutes": 4, "threshold_points": 9}
  },
  "entry": {
    "long": {"all": [{"left": "momentum", "op": ">=", "right": "9"}]},
    "short": {"all": [{"left": "momentum", "op": "<=", "right": "-9"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 12},
    "take_profit": {"type": "points", "value": 18},
    "max_holding_minutes": 20
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 24,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "momentum_lookback_minutes": {"values": [3, 4, 6]},
    "momentum_threshold_points": {"values": [7, 9, 12]},
    "stop_points": {"values": [10, 12, 16]},
    "take_profit_points": {"values": [16, 18, 24]},
    "max_holding_minutes": {"values": [12, 20]}
  },
  "cost_model": "nq_conservative_v1"
}
