{
  "schema_version": 0,
  "name": "nq_opening_range_late_breakout_v1",
  "strategy_family": "opening_range_breakout",
  "market_hypothesis": "Late regular-session NQ range breaks can follow afternoon liquidity shifts when the opening range is measured after the initial volatility burst.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "15:00-20:30", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "opening_range": {"type": "opening_range", "minutes": 12}
  },
  "entry": {
    "long": {"all": [{"left": "close", "op": ">", "right": "opening_range.high"}]},
    "short": {"all": [{"left": "close", "op": "<", "right": "opening_range.low"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 12},
    "take_profit": {"type": "points", "value": 18},
    "max_holding_minutes": 28
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 18,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "opening_range_minutes": {"values": [8, 12, 18]},
    "stop_points": {"values": [10, 12, 16]},
    "take_profit_points": {"values": [16, 18, 24]},
    "max_holding_minutes": {"values": [20, 28]}
  },
  "cost_model": "nq_conservative_v1"
}
