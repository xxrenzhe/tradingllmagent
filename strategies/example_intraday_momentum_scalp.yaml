{
  "schema_version": 0,
  "name": "nq_intraday_momentum_scalp_v1",
  "strategy_family": "intraday_momentum",
  "market_hypothesis": "Short NQ momentum bursts can persist for a few minutes when a small point threshold is crossed during regular liquidity.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:35-20:30", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "momentum": {"type": "momentum", "lookback_minutes": 2, "threshold_points": 4}
  },
  "entry": {
    "long": {"all": [{"left": "momentum", "op": ">=", "right": "4"}]},
    "short": {"all": [{"left": "momentum", "op": "<=", "right": "-4"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 8},
    "take_profit": {"type": "points", "value": 10},
    "max_holding_minutes": 12
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 60,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "momentum_lookback_minutes": {"values": [1, 2, 3]},
    "momentum_threshold_points": {"values": [3, 4, 6]},
    "stop_points": {"values": [6, 8, 10]},
    "take_profit_points": {"values": [8, 10, 14]},
    "max_holding_minutes": {"values": [8, 12, 18]}
  },
  "cost_model": "nq_conservative_v1"
}
