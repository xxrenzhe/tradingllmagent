{
  "schema_version": 0,
  "name": "nq_volatility_expansion_scalp_v1",
  "strategy_family": "volatility_expansion",
  "market_hypothesis": "Small NQ range expansions can trigger short continuation bursts when the prior bar is exceeded and exits are tight.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {"timezone": "UTC", "trade": "13:35-20:30", "flatten": "20:55"},
  "regime_filter": {},
  "indicators": {
    "realized_volatility": {"type": "realized_volatility", "window": 4, "expansion_multiple": 1.15}
  },
  "entry": {
    "long": {"all": [{"left": "close", "op": ">", "right": "prior_high"}]},
    "short": {"all": [{"left": "close", "op": "<", "right": "prior_low"}]}
  },
  "exit": {
    "stop_loss": {"type": "points", "value": 8},
    "take_profit": {"type": "points", "value": 12},
    "max_holding_minutes": 14
  },
  "risk": {
    "position_sizing": {"type": "fixed_contracts", "contracts": 1},
    "max_position_contracts": 1,
    "max_trades_per_day": 56,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
    "forbid_position_increase_when_unrealized_loss": true,
    "max_grid_levels": 0
  },
  "parameters": {
    "volatility_window": {"values": [3, 4, 6]},
    "volatility_expansion_multiple": {"values": [1.1, 1.15, 1.25]},
    "stop_points": {"values": [6, 8, 10]},
    "take_profit_points": {"values": [10, 12, 16]},
    "max_holding_minutes": {"values": [10, 14, 20]}
  },
  "cost_model": "nq_conservative_v1"
}
