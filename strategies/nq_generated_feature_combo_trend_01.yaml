{
  "schema_version": 0,
  "name": "nq_generated_feature_combo_trend_01",
  "strategy_family": "trend_pullback",
  "market_hypothesis": "trend pullback candidate generated from random intraday feature combination volume_spike_ratio, minute_of_session_sin, high_low_range_pct, vwap_slope_15m; the feature mix is tested as a bounded NQ one-minute seed for LLM-guided parameter search.",
  "symbol": "NQmain",
  "timeframe": "1m",
  "direction": "long_short",
  "session": {
    "timezone": "UTC",
    "trade": "13:35-20:30",
    "flatten": "20:55"
  },
  "feature_set": [
    {
      "name": "volume_spike_ratio",
      "category": "volume",
      "data_level": "bar",
      "description": "Current volume divided by recent average volume."
    },
    {
      "name": "minute_of_session_sin",
      "category": "time",
      "data_level": "calendar",
      "description": "Sine transform of session minute."
    },
    {
      "name": "high_low_range_pct",
      "category": "volatility",
      "data_level": "bar",
      "description": "Current high-low range over close."
    },
    {
      "name": "vwap_slope_15m",
      "category": "vwap",
      "data_level": "bar",
      "description": "Fifteen-minute VWAP slope."
    },
    {
      "name": "chaikin_oscillator",
      "category": "volume",
      "data_level": "bar",
      "description": "Chaikin oscillator."
    },
    {
      "name": "linear_reg_angle_20",
      "category": "trend",
      "data_level": "bar",
      "description": "Twenty-bar linear regression angle."
    }
  ],
  "generation": {
    "method": "deterministic_random_feature_combo",
    "global_index": 2,
    "feature_catalog_size": 112
  },
  "regime_filter": {},
