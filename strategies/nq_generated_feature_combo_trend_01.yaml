      "type": "ema",
      "window": 8
    },
    "ema_slow": {
      "type": "ema",
      "window": 21
    }
  },
  "entry": {
    "long": {
      "all": [
        {
          "left": "ema_fast",
          "op": ">",
          "right": "ema_slow"
        }
      ]
    },
    "short": {
      "all": [
        {
          "left": "ema_fast",
          "op": "<",
          "right": "ema_slow"
        }
      ]
    }
  },
  "exit": {
