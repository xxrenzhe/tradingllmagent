    "take_profit": {
      "type": "points",
      "value": 20
    },
    "max_holding_minutes": 28
  },
  "risk": {
    "position_sizing": {
      "type": "fixed_contracts",
      "contracts": 1
    },
    "max_position_contracts": 1,
    "max_trades_per_day": 35,
    "max_daily_loss_r": 3
  },
  "anti_martingale_constraints": {
    "forbid_loss_doubling": true,
