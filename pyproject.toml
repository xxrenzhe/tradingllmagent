[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingllmagent"
version = "0.1.0"
description = "Local LLM-driven NQ strategy research and backtesting system"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tlm = "tlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
