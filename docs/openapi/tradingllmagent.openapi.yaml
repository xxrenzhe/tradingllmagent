openapi: 3.1.0
info:
  title: Trading LLM Agent System API
  version: 0.2.0
  description: Local research, monitor, paper-shadow, execution readiness, and NT8 sim gateway contract.
paths:
  /api/health:
    get:
      summary: API health check.
      responses:
        "200":
          description: Health status.
  /api/data/symbols:
    get:
      summary: List configured symbols.
      responses:
        "200":
          description: Symbol configuration map.
  /api/data/download:
    post:
      summary: Queue a data download task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/data/build-bars:
    post:
      summary: Queue bar aggregation from normalized tick data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/import-firstrate:
    post:
      summary: Queue FirstRate NQ 1m CSV import into local bar partitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/bar-quality:
    post:
      summary: Queue bar-level data quality checks for imported NQ data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/split-manifest:
    post:
      summary: Queue dataset split manifest generation with hidden final holdout policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/import-databento-quotes:
    post:
      summary: Queue Databento TBBO or MBP-1 quote CSV import into local quote partitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/import-databento-tbbo:
    post:
      summary: Queue Databento TBBO CSV import using the quote partition importer.
      responses:
        "200":
          description: Queued task.
  /api/data/import-databento-ohlcv:
    post:
      summary: Queue Databento NQ.FUT OHLCV-1m import into continuous daily-volume bar partitions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/quote-replay:
    post:
      summary: Queue quote-level bid/ask execution replay for candidate backtest trades.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataTaskRequest"
      responses:
        "200":
          description: Queued task.
  /api/data/quality:
    get:
      summary: Build a local data quality report.
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Data quality report.
  /api/tasks:
    get:
      summary: List queued, running, and completed tasks.
      responses:
        "200":
          description: Task list.
  /api/tasks/{task_id}:
    get:
      summary: Get a task by id.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task.
  /api/tasks/{task_id}/cancel:
    post:
      summary: Cancel a non-terminal task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Updated task.
  /api/tasks/{task_id}/run:
    post:
      summary: Run a queued task synchronously.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Updated task.
  /api/tasks/{task_id}/logs:
    get:
      summary: List task logs.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task logs.
  /api/tasks/{task_id}/events:
    get:
      summary: Stream task and log updates using SSE.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: SSE stream.
  /api/strategies/validate:
    post:
      summary: Validate a local Strategy Spec.
      responses:
        "200":
          description: Strategy validation result.
  /api/backtests/bar:
    post:
      summary: Queue a bar backtest task.
      responses:
        "200":
          description: Queued task.
  /api/backtests/tick:
    post:
      summary: Queue a tick replay backtest task.
      responses:
        "200":
          description: Queued task.
  /api/experiments/research-runs:
    post:
      summary: Queue a research run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRunRequest"
      responses:
        "200":
          description: Queued task.
  /api/experiments/proposals:
    post:
      summary: Queue an LLM strategy proposal task.
      responses:
        "200":
          description: Queued task.
  /api/experiments/iterations:
    post:
      summary: Queue proposal plus research iteration.
      responses:
        "200":
          description: Queued task.
  /api/experiments/target-discovery:
    post:
      summary: Queue repeated LLM strategy discovery against explicit performance targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetDiscoveryRequest"
      responses:
        "200":
          description: Queued task.
  /api/experiments/{experiment_id}:
    get:
      summary: Load experiment summary from SQLite.
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Experiment summary.
  /api/experiments/{experiment_id}/audit-logs:
    get:
      summary: Load experiment audit logs.
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Audit log list.
  /api/experiments/{experiment_id}/artifacts:
    get:
      summary: Load trades, equity, metrics, and artifacts for a research trial.
      parameters:
        - $ref: "#/components/parameters/ExperimentId"
      responses:
        "200":
          description: Research artifact bundle.
  /api/reports/leaderboard:
    get:
      summary: Load the hard-gated leaderboard report.
      responses:
        "200":
          description: Leaderboard report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardReport"
  /api/events/validate:
    post:
      summary: Validate an event calendar.
      responses:
        "200":
          description: Event calendar validation.
  /api/events:
    get:
      summary: List event calendar rows with optional symbol/date filters.
      responses:
        "200":
          description: Event calendar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCalendar"
  /api/events/context:
    post:
      summary: Build point-in-time event contexts for bar data.
      responses:
        "200":
          description: Event context rows.
  /api/monitor/once:
    post:
      summary: Queue one runtime monitor scan.
      responses:
        "200":
          description: Queued task.
  /api/monitor/run:
    post:
      summary: Queue a continuous or scheduled monitor run.
      responses:
        "200":
          description: Queued task.
  /api/monitor/replay:
    post:
      summary: Queue monitor replay against historical snapshots.
      responses:
        "200":
          description: Queued task.
  /api/monitor/report:
    post:
      summary: Build a runtime monitor report immediately.
      responses:
        "200":
          description: Monitor report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorReport"
  /api/execution/intents:
    post:
      summary: Build an execution intent and deterministic risk decision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionIntentRequest"
      responses:
        "200":
          description: Execution intent with risk result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionIntentResponse"
  /api/execution/paper-shadow:
    post:
      summary: Persist a paper-shadow execution intent audit event.
      responses:
        "200":
          description: Paper shadow audit result.
  /api/execution/readiness:
    post:
      summary: Evaluate paper, sim, micro-live, or controlled-live readiness evidence.
      responses:
        "200":
          description: Readiness decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessDecision"
  /api/execution/approval-queue:
    get:
      summary: List execution intents pending human approval.
      responses:
        "200":
          description: Approval queue.
  /api/execution/risk-profiles:
    get:
      summary: List audited execution risk profiles.
      responses:
        "200":
          description: Risk profile registry.
    post:
      summary: Write an audited execution risk profile registry.
      responses:
        "200":
          description: Risk profile registry.
  /api/readiness/external-validation:
    post:
      summary: Build an external validation evidence artifact.
      responses:
        "200":
          description: External validation artifact.
  /api/calibration/costs:
    post:
      summary: Build a cost model calibration artifact from runtime samples.
      responses:
        "200":
          description: Cost calibration artifact.
  /api/modules:
    get:
      summary: List strategy modules in the local catalog.
      responses:
        "200":
          description: Module catalog.
  /api/modules/memory:
    get:
      summary: Summarize module performance memory.
      responses:
        "200":
          description: Module memory summary.
  /api/features/readiness:
    get:
      summary: Load feature registry readiness and generated strategy audit manifest.
      responses:
        "200":
          description: Feature readiness report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureReadinessReport"
  /api/vol/overview:
    get:
      summary: Load VOL execution-aware optimization readiness, leaderboard, cost, quote, paper, and mutation reports.
      responses:
        "200":
          description: VOL optimization overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolOverviewReport"
  /api/vol/readiness:
    post:
      summary: Queue VOL feature readiness artifact generation.
      responses:
        "200":
          description: Queued task.
  /api/vol/seed-search:
    post:
      summary: Queue deterministic VOL execution-aware seed strategy generation.
      responses:
        "200":
          description: Queued task.
  /api/vol/pre-screen:
    post:
      summary: Queue NQ_CME OHLCV VOL seed pre-screen and leaderboard generation.
      responses:
        "200":
          description: Queued task.
  /api/vol/cost-stress:
    post:
      summary: Queue VOL candidate execution cost stress report generation.
      responses:
        "200":
          description: Queued task.
  /api/vol/artifacts:
    post:
      summary: Queue all VOL research artifacts in the optimization plan.
      responses:
        "200":
          description: Queued task.
  /api/vol/quote-fill-replay:
    post:
      summary: Queue quote fill replay or blocked quote replay readiness artifact.
      responses:
        "200":
          description: Queued task.
  /api/vol/paper-shadow-review:
    post:
      summary: Queue VOL paper shadow review artifact generation.
      responses:
        "200":
          description: Queued task.
  /api/vol/mutation-backfill:
    post:
      summary: Queue VOL mutation memory backfill from research outcomes.
      responses:
        "200":
          description: Queued task.
  /api/paper/replay:
    post:
      summary: Replay backtest trades into a paper equity curve.
      responses:
        "200":
          description: Paper replay result.
  /api/paper/nt-export-signal:
    post:
      summary: Export offline NinjaTrader CSV or OIF signals.
      responses:
        "200":
          description: Offline export payload.
  /api/gateways/nt8/health:
    get:
      summary: Check NT8 sim gateway health.
      responses:
        "200":
          description: Gateway health.
  /api/gateways/nt8/accounts:
    get:
      summary: List available NT8 sim accounts.
      responses:
        "200":
          description: Account list.
  /api/gateways/nt8/instruments:
    get:
      summary: List available NT8 sim instruments.
      responses:
        "200":
          description: Instrument list.
  /api/gateways/nt8/commands:
    post:
      summary: Submit an NT8 sim gateway command.
      description: Supports marketOrder, marketBatch, cancelOrders, flatten, flattenBatch, closeQty, and bracket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GatewayCommand"
      responses:
        "200":
          description: Gateway ACK/NACK.
  /api/gateways/nt8/reconciliation:
    get:
      summary: Get reconciliation status.
      responses:
        "200":
          description: Reconciliation report.
    post:
      summary: Reconcile expected positions against gateway state.
      responses:
        "200":
          description: Reconciliation report.
  /api/gateways/nt8/order-updates:
    get:
      summary: List append-only NT8 gateway order update events.
      responses:
        "200":
          description: Order update event stream.
  /api/gateways/nt8/incidents:
    get:
      summary: List NT8 gateway incidents and external interventions.
      responses:
        "200":
          description: Incident timeline.
  /api/gateways/ibkr/health:
    get:
      summary: Check IBKR paper gateway health.
      responses:
        "200":
          description: IBKR paper gateway health.
  /api/gateways/ibkr/readiness:
    get:
      summary: Check IBKR paper-only account and connection readiness.
      responses:
        "200":
          description: IBKR paper readiness report.
  /api/gateways/ibkr/contracts:
    get:
      summary: Check IBKR MNQ contract readiness.
      responses:
        "200":
          description: IBKR contract readiness report.
    post:
      summary: Record IBKR contract details for readiness validation.
      responses:
        "200":
          description: IBKR contract details event.
  /api/gateways/ibkr/contracts/sync:
    post:
      summary: Request IBKR contract details from the configured paper adapter and record them locally.
      responses:
        "200":
          description: IBKR contract sync event.
  /api/gateways/ibkr/market-data:
    get:
      summary: Check IBKR real-time market data readiness.
      responses:
        "200":
          description: IBKR market data readiness report.
    post:
      summary: Record IBKR market data snapshot for readiness validation.
      responses:
        "200":
          description: IBKR market data event.
  /api/gateways/ibkr/market-data/sync:
    post:
      summary: Request IBKR market data from the configured paper adapter and record it locally.
      responses:
        "200":
          description: IBKR market data sync event.
  /api/gateways/ibkr/connect:
    post:
      summary: Connect to an IBKR paper gateway adapter.
      responses:
        "200":
          description: IBKR connection event.
  /api/gateways/ibkr/disconnect:
    post:
      summary: Disconnect the IBKR paper gateway adapter.
      responses:
        "200":
          description: IBKR disconnect event.
  /api/gateways/ibkr/safe-mode:
    post:
      summary: Force IBKR paper gateway safe mode.
      responses:
        "200":
          description: IBKR safe-mode incident.
  /api/gateways/ibkr/bracket-orders:
    get:
      summary: Report open IBKR paper bracket order drafts and recent order events.
      responses:
        "200":
          description: IBKR bracket order report.
    post:
      summary: Build a paper-only IBKR bracket order draft.
      responses:
        "200":
          description: IBKR bracket order event.
  /api/gateways/ibkr/bracket-orders/{bracket_id}/submit:
    post:
      summary: Submit a previously built IBKR paper bracket order draft through the configured adapter.
      responses:
        "200":
          description: IBKR bracket order submit event.
  /api/gateways/ibkr/cancel-orders:
    post:
      summary: Cancel open IBKR paper order drafts.
      responses:
        "200":
          description: IBKR cancel order event.
  /api/gateways/ibkr/flatten:
    post:
      summary: Flatten tracked IBKR paper position state.
      responses:
        "200":
          description: IBKR paper flatten event.
  /api/gateways/ibkr/kill-switch:
    post:
      summary: Cancel orders, flatten paper position, and enter safe mode.
      responses:
        "200":
          description: IBKR kill-switch response.
  /api/gateways/ibkr/execution-ledger:
    get:
      summary: List IBKR paper fills, positions, account snapshots, and PnL summary.
      responses:
        "200":
          description: IBKR paper execution ledger.
  /api/gateways/ibkr/orders:
    get:
      summary: List IBKR paper order drafts, order statuses, and order events.
      responses:
        "200":
          description: IBKR paper order report.
  /api/gateways/ibkr/order-status:
    post:
      summary: Record an IBKR paper order status callback.
      responses:
        "200":
          description: IBKR paper order status event.
  /api/gateways/ibkr/executions:
    get:
      summary: List IBKR paper execution fills and realized PnL.
      responses:
        "200":
          description: IBKR paper executions report.
    post:
      summary: Record an IBKR paper execution fill and commission.
      responses:
        "200":
          description: IBKR paper execution fill event.
  /api/gateways/ibkr/positions:
    get:
      summary: List IBKR paper positions and tracked MNQ quantity.
      responses:
        "200":
          description: IBKR paper positions report.
    post:
      summary: Record an IBKR paper position snapshot.
      responses:
        "200":
          description: IBKR paper position event.
  /api/gateways/ibkr/positions/sync:
    post:
      summary: Request IBKR paper positions from the configured adapter and record them locally.
      responses:
        "200":
          description: IBKR paper positions sync event.
  /api/gateways/ibkr/account-snapshots:
    get:
      summary: List IBKR paper account and PnL snapshots.
      responses:
        "200":
          description: IBKR paper account snapshots report.
    post:
      summary: Record an IBKR paper account and PnL snapshot.
      responses:
        "200":
          description: IBKR paper account snapshot event.
  /api/gateways/ibkr/account-snapshots/sync:
    post:
      summary: Request an IBKR paper account snapshot from the configured adapter and record it locally.
      responses:
        "200":
          description: IBKR paper account snapshot sync event.
  /api/gateways/ibkr/runtime-events/sync:
    post:
      summary: Drain IBKR order status and execution callbacks from the configured adapter into the local paper ledger.
      responses:
        "200":
          description: IBKR runtime event sync event.
  /api/gateways/ibkr/reconciliation:
    post:
      summary: Reconcile tracked IBKR paper position against expected quantity.
      responses:
        "200":
          description: IBKR paper reconciliation report.
  /api/gateways/ibkr/reviews:
    post:
      summary: Build a 5-minute IBKR structured review request and fallback result.
      responses:
        "200":
          description: IBKR 5-minute structured review payload.
  /api/gateways/ibkr/fast-path-optimizer:
    post:
      summary: Apply risk-reducing fast-path control diffs from an IBKR review result.
      responses:
        "200":
          description: IBKR fast-path optimizer diff report.
  /api/gateways/ibkr/incidents:
    get:
      summary: List IBKR paper gateway incidents.
      responses:
        "200":
          description: IBKR incident timeline.
  /api/gateways/ibkr/poller:
    get:
      summary: Report the in-process IBKR Paper runtime poller status.
      responses:
        "200":
          description: IBKR poller state.
  /api/ibkr-paper/runs:
    post:
      summary: Create an append-only IBKR Paper run artifact bundle.
      responses:
        "200":
          description: IBKR Paper run artifact manifest.
  /api/ibkr-paper/runs/{run_id}:
    get:
      summary: Load a persisted IBKR Paper run report.
      responses:
        "200":
          description: IBKR Paper run daily report.
  /api/ibkr-paper/reviews:
    get:
      summary: List recent IBKR Paper 5-minute review cycles.
      responses:
        "200":
          description: IBKR Paper review history.
  /api/ibkr-paper/reports/{run_id}:
    get:
      summary: Load current or persisted IBKR Paper runtime report.
      responses:
        "200":
          description: IBKR Paper runtime report.
  /api/incidents:
    post:
      summary: Record an incident or force gateway safety mode.
      responses:
        "200":
          description: Incident response.
components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    ExperimentId:
      name: experiment_id
      in: path
      required: true
      schema:
        type: string
    Symbol:
      name: symbol
      in: query
      required: true
      schema:
        type: string
    DateFrom:
      name: date_from
      in: query
      required: true
      schema:
        type: string
        format: date
    DateTo:
      name: date_to
      in: query
      required: true
      schema:
        type: string
        format: date
  schemas:
    Task:
      type: object
      required: [task_id, task_type, status, payload, created_at, updated_at]
      properties:
        task_id:
          type: string
        task_type:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        payload:
          type: object
        result:
          type: object
        error:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    DataTaskRequest:
      type: object
      required: [symbol, date_from, date_to]
      properties:
        symbol:
          type: string
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        timeframe:
          type: string
        granularity:
          type: string
    ResearchRunRequest:
      type: object
      required: [date_from, date_to]
      properties:
        spec:
          type: string
        specs:
          type: array
          items:
            type: string
        experiment_id:
          type: string
        execution_mode:
          type: string
          enum: [bar, tick, bar_then_tick]
        max_trials:
          type: integer
        max_trials_per_family:
          type: integer
    TargetDiscoveryRequest:
      type: object
      required: [date_from, date_to]
      properties:
        spec:
          type: string
          description: Optional explicit seed spec. If omitted, the worker scans local seed strategies.
        specs:
          type: array
          items:
            type: string
          description: Optional explicit seed spec list.
        strategies_root:
          type: string
          default: strategies
        symbol:
          type: string
        timeframe:
          type: string
        strategy_families:
          type: array
          items:
            type: string
        max_seed_strategies:
          type: integer
        experiment_id:
          type: string
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        max_rounds:
          type: integer
          default: 10
        trials_per_round:
          type: integer
          default: 1
        target_count:
          type: integer
          default: 1
        min_annual_trades:
          type: number
          default: 1000
        min_sharpe:
          type: number
          default: 2
        min_win_probability:
          type: number
          default: 0.53
        execution_mode:
          type: string
          enum: [bar, tick, bar_then_tick]
        llm_model:
          type: string
        llm_parameters:
          type: object
    LeaderboardReport:
      type: object
      properties:
        summary:
          type: object
        leaderboard:
          type: array
          items:
            type: object
        candidate_leaderboard:
          type: array
          items:
            type: object
        freeze_confirmed_leaderboard:
          type: array
          items:
            type: object
        rejected:
          type: array
          items:
            type: object
        rows:
          type: array
          items:
            type: object
    FeatureReadinessReport:
      type: object
      required: [feature_count, features, by_status, generated_strategy_summary]
      properties:
        feature_count:
          type: integer
        by_status:
          type: object
        by_data_level:
          type: object
        by_leakage_risk:
